name: Build & Release Desktop App

# 사용법
#   1) package.json 의 version 을 올린다 (예: 1.0.0 → 1.0.1)
#   2) git tag v1.0.1 && git push origin v1.0.1
#   → Windows / macOS 설치 파일이 자동으로 빌드되어 GitHub Releases 에 게시된다.
#   → 이미 설치된 앱들은 다음 실행 때 "새 버전이 나왔어요" 안내를 띄운다.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 는 lock 파일이 조금만 어긋나도 실패하므로, 관대한 install 을 쓴다.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # 저장소 Settings → Secrets and variables → Actions 에 등록한 값이 빌드에 들어간다.
          # 웹(Vercel)과 같은 값을 넣으면 앱에서도 동일한 비밀번호로 로그인된다.
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_MEMBER_PASSWORD: ${{ secrets.VITE_MEMBER_PASSWORD }}

      # 태그를 푸시한 경우 → Releases 페이지에 게시 (팀원 배포용)
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 수동 실행(workflow_dispatch)인 경우 → Actions 실행 결과에서 바로 내려받기
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
